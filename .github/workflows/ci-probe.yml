name: macOS probe

# 一次性探针：只回答一个问题——现在这个账号/仓库到底拿不拿得到 macOS 机器。
# 一个 job、一个 echo，不依赖任何别的 job。跑完就删。
on:
  workflow_dispatch:

jobs:
  probe:
    name: probe macos runner
    runs-on: macos-13
    timeout-minutes: 20
    steps:
      - name: 打印环境
        run: |
          uname -a
          xcodebuild -version || true
          df -h / | tail -1
