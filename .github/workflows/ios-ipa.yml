name: iOS IPA

# 在 GitHub 的 macOS runner 上把 ios/ 编成未签名 IPA，产物同时：
#   1) 作为 Actions artifact 留存（私有仓库只有登录者可下载）
#   2) 上传到飞书群（走 tools/notify/lark.py 的机器人文件消息）
#
# 为什么是"未签名 IPA"：签名需要 Apple 开发者证书 + provisioning profile，
# 这两样不在仓库里。未签名包用 Sideloadly / AltStore 自签后即可安装，
# 适合自用分发；要出正式签名包，见文末"签名"说明。

on:
  workflow_dispatch:
    inputs:
      notify:
        description: "构建成功后发送到飞书群"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "tools/notify/lark.py"
      - ".github/workflows/ios-ipa.yml"

concurrency:
  group: ios-ipa
  cancel-in-progress: false

jobs:
  # 纯逻辑自测：不碰模拟器、不碰网络，几秒出结果。
  # 网络层的口径（排序权重 / 原唱判定 / 码率区间 / 酷我文本解析）都钉在 ios/SelfTest 的断言里，
  # 改坏了在这里就红，不用等 IPA 打出来才发现"这首歌排到后面去了"。
  logic-tests:
    name: logic tests (swiftc)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: Swift 版本
        run: swift --version

      # pbxproj 是手写的：先离线判掉"括号不平衡 / 引用了不存在的对象 / target 缺字段"，
      # 否则 xcodebuild 只会给一句含糊的 "Cycle inside" 或 "target has no product"。
      - name: 检查手写 pbxproj
        run: python3 tools/ios/check_pbxproj.py

      - name: 检查界面卫生（硬编码字号 / 固定行高）
        run: python3 tools/ios/check_ui_hygiene.py

      - name: 编译网络层 + 跑断言
        run: |
          set -euo pipefail
          mkdir -p build
          swiftc -Onone -swift-version 5 -o build/jz-selftest \
            ios/JZMusicHelper/Models/Song.swift \
            ios/JZMusicHelper/Models/DownloadItem.swift \
            ios/JZMusicHelper/Services/APIClient.swift \
            ios/JZMusicHelper/Services/SearchAdapters.swift \
            ios/JZMusicHelper/Services/SearchRanker.swift \
            ios/JZMusicHelper/Services/NameMatch.swift \
            ios/JZMusicHelper/Services/StudioPick.swift \
            ios/JZMusicHelper/Services/KuwoParser.swift \
            ios/JZMusicHelper/Services/SourceAdapters.swift \
            ios/JZMusicHelper/Services/SearchService.swift \
            ios/JZMusicHelper/Services/URLResolver.swift \
            ios/JZMusicHelper/Services/PlaybackRules.swift \
            ios/JZMusicHelper/Services/DownloadGuard.swift \
            ios/JZMusicHelper/Services/DiscoverRules.swift \
            ios/JZMusicHelper/Services/RecognizeScore.swift \
            ios/JZMusicHelper/Services/FingerprintPCM.swift \
            ios/JZMusicHelper/Services/NeteaseRecognizer.swift \
            ios/JZMusicHelper/Services/IntentInbox.swift \
            ios/JZMusicHelper/Services/PlaybackActivityModel.swift \
            ios/JZMusicHelper/Services/LayoutRules.swift \
            ios/JZMusicHelper/Models/DiscoverCatalog.swift \
            ios/JZMusicHelper/Services/LyricsModel.swift \
            ios/JZMusicHelper/Services/LyricsCleaning.swift \
            ios/JZMusicHelper/Services/TraditionalMap.swift \
            ios/JZMusicHelper/Services/LddcCrypto.swift \
            ios/JZMusicHelper/Services/LddcMatch.swift \
            ios/JZMusicHelper/Services/LddcLyrics.swift \
            ios/JZMusicHelper/Services/KwLyrics.swift \
            ios/JZMusicHelper/Services/LyricsService.swift \
            ios/JZMusicHelper/Services/CoverResolver.swift \
            ios/SelfTest/LyricsFixtures.swift \
            ios/SelfTest/main.swift 2>&1 | tee build/selftest-build.log
          ./build/jz-selftest 2>&1 | tee build/selftest.log

      - name: 接口实测（信息性，失败不算构建失败）
        continue-on-error: true
        run: |
          set -uo pipefail
          timeout 240 python3 tools/ios/probe_network.py "晴天 周杰伦" 2>&1 | tee build/probe.log || true

      - name: 结果写进 summary
        if: always()
        run: |
          {
            echo "### 网络层逻辑自测"
            echo '```'
            tail -80 build/selftest.log 2>/dev/null || echo "(没有 selftest.log)"
            echo '```'
            if [ -f build/probe.log ]; then
              echo "<details><summary>接口实测</summary>"
              echo ""
              echo '```'
              tail -40 build/probe.log
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时留存日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-log
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 7

  build-ipa:
    needs: logic-tests
    name: build unsigned ipa
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ARTIFACT_DIR: out
      # 飞书机器人凭据（仓库 Secrets；没有就只留 artifact，不报错）
      LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
      LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
      LARK_CHAT_ID: ${{ secrets.LARK_CHAT_ID }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境信息（Xcode / Swift / 版本号）
        id: meta
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version || true
          VERSION=$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' android/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)"/\1/')
          CODE=$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' android/app/build.gradle.kts | head -1 | grep -oE '[0-9]+')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          echo "版本：v${VERSION}（versionCode ${CODE}）"

      - name: 编译（未签名，device arm64）
        run: |
          set -euo pipefail
          mkdir -p build
          set +e
          xcodebuild \
            -project ios/JZMusicHelper.xcodeproj \
            -target JZMusicHelper \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build/products" \
            OBJROOT="$PWD/build/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build/xcodebuild.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          set -e
          if ! grep -q "BUILD SUCCEEDED" build/xcodebuild.log; then
            echo "::error::xcodebuild 失败"
            grep -E "error:" build/xcodebuild.log | head -50 || true
            tail -30 build/xcodebuild.log
            exit 1
          fi

      - name: 打包成 IPA
        id: pkg
        run: |
          set -euo pipefail
          APP=$(find build/products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "::error::没找到 .app 产物"; exit 1; }
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR/Payload"
          cp -R "$APP" "$ARTIFACT_DIR/Payload/"
          # 文件名带构建戳：iOS 的版本号是从 Android 的 versionName 读的（2.1.95 要一起改），
          # 所以纯靠版本号无法区分两次出包——群里两个同名文件，装回旧的都很正常。
          STAMP="${GITHUB_SHA:0:7}-r${GITHUB_RUN_NUMBER}"
          IPA="JZ-Music-v${VERSION}-${STAMP}-ios-unsigned.ipa"
          (cd "$ARTIFACT_DIR" && zip -qry "$IPA" Payload)
          SIZE=$(stat -f%z "$ARTIFACT_DIR/$IPA")
          SHA=$(shasum -a 256 "$ARTIFACT_DIR/$IPA" | cut -d' ' -f1)
          # 用 awk 出两位小数：这个包只有 ~1MB，整数除法会写成 "0 MB"
          MB=$(awk "BEGIN{printf \"%.2f\", $SIZE/1048576}")
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "mb=$MB" >> "$GITHUB_OUTPUT"
          {
            echo "### iOS IPA（未签名）"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 文件 | \`$IPA\` |"
            echo "| 大小 | ${MB} MB |"
            echo "| SHA-256 | \`$SHA\` |"
            echo "| 版本 | v${VERSION}（versionCode ${CODE}）|"
            echo "| 构建戳 | \`$STAMP\` |"
            echo "| 运行 | [第 $GITHUB_RUN_NUMBER 次]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # 扩展是不是真的被嵌进去了：只看"编译成功"是不够的（copy phase 漏挂也会 BUILD SUCCEEDED）
      - name: 校验插件已嵌入（PlugIns/*.appex）
        run: |
          set -euo pipefail
          unzip -l "$ARTIFACT_DIR/${{ steps.pkg.outputs.ipa }}" | tee build/ipa-list.txt
          if ! grep -qE "PlugIns/.*\.appex/" build/ipa-list.txt; then
            echo "::error::IPA 里没有 PlugIns/*.appex —— Widget/Live Activity 扩展没被嵌进去"
            exit 1
          fi

      - name: 留存 artifact
        uses: actions/upload-artifact@v4
        with:
          name: JZ-Music-v${{ steps.meta.outputs.version }}-${{ steps.pkg.outputs.stamp }}-ios-ipa
          path: out/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: 发到飞书群
        if: ${{ env.LARK_APP_ID != '' && (github.event_name == 'push' || inputs.notify) }}
        continue-on-error: true
        run: |
          set -euo pipefail
          BODY=$(printf '版本：v%s（versionCode %s）\n构建戳：%s\n大小：%s MB\nSHA-256：%s\n构建：GitHub Actions · macos-15 · run #%s\n说明：未签名包，用 Sideloadly / AltStore 自签后可安装到 iPhone。装之前核对文件名里的构建戳，别装回上一包。' \
            "$VERSION" "$CODE" "${{ steps.pkg.outputs.stamp }}" "${{ steps.pkg.outputs.mb }}" "${{ steps.pkg.outputs.sha }}" "$GITHUB_RUN_NUMBER")
          python3 tools/notify/lark.py \
            --title "iOS v${VERSION} · ${{ steps.pkg.outputs.stamp }} 已出包（未签名 IPA）" \
            --file "out/${{ steps.pkg.outputs.ipa }}" \
            --name "${{ steps.pkg.outputs.ipa }}" \
            --body "$BODY"

      - name: 飞书未配置时的提示
        if: ${{ env.LARK_APP_ID == '' }}
        run: echo "::warning::仓库没有配置 LARK_APP_ID / LARK_APP_SECRET / LARK_CHAT_ID，跳过飞书推送（IPA 仍在 artifact 里）"

      - name: 失败时通知飞书
        if: failure() && env.LARK_APP_ID != ''
        continue-on-error: true
        run: |
          BODY=$(printf '版本：v%s\n运行：%s/%s/actions/runs/%s' "$VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          python3 tools/notify/lark.py --fail --title "iOS 构建失败" --body "$BODY"

      - name: 失败时附上编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7


  # 真机之前能自动做的那一层：iOS 模拟器里装起来、启动、截图。
  # 能抓：启动崩溃、首屏渲染错乱、393pt 宽度下的布局塌陷。
  # 抓不到：麦克风识曲、真实出声、锁屏/灵动岛、自签安装、后台音频——那些只能真机。
  simulator-smoke:
    needs: build-ipa
    name: simulator smoke (boot + launch + screenshot)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 编译模拟器版本
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project ios/JZMusicHelper.xcodeproj \
            -target JZMusicHelper \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT="$PWD/build/sim" \
            OBJROOT="$PWD/build/simobj" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            > build/sim-build.log 2>&1 || { tail -40 build/sim-build.log; exit 1; }
          grep -E "BUILD (SUCCEEDED|FAILED)" build/sim-build.log

      - name: 启动模拟器并安装
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available | grep -Eo "iPhone 1[6-9]( Pro| Plus)? " | head -1 | xargs)
          echo "设备：$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP=$(find build/sim -maxdepth 2 -name 'JZMusicHelper.app' | head -1)
          echo "APP=$APP"
          xcrun simctl install "$DEVICE" "$APP"

      - name: 启动 App 并截图（首启 + 重进）
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available | grep -Eo "iPhone 1[6-9]( Pro| Plus)? " | head -1 | xargs)
          mkdir -p shots
          # 关掉通知权限弹窗，否则首启截图会被系统弹窗盖住
          SIMCTL_CHILD_JZ_SKIP_NOTIFICATION_PROMPT=1 xcrun simctl launch --terminate-running-process "$DEVICE" com.jz.musichelper
          sleep 8
          xcrun simctl io "$DEVICE" screenshot shots/01-launch.png
          xcrun simctl terminate "$DEVICE" com.jz.musichelper || true
          sleep 1
          SIMCTL_CHILD_JZ_SKIP_NOTIFICATION_PROMPT=1 xcrun simctl launch "$DEVICE" com.jz.musichelper
          sleep 6
          xcrun simctl io "$DEVICE" screenshot shots/02-relaunch.png
          ls -la shots

      - name: 留存截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-shots
          path: shots/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: 失败时留存日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-logs
          path: build/sim-build.log
          if-no-files-found: ignore
          retention-days: 7

# 要出签名 IPA 时（需要 Apple Developer 账号），在仓库 Secrets 里加：
#   IOS_CERT_P12_BASE64  IOS_CERT_PASSWORD  IOS_PROFILE_BASE64  IOS_TEAM_ID
# 然后把"编译"换成 xcodebuild archive + -exportArchive（exportOptions.plist 里
# method 用 development 或 app-store），再把导出的 .ipa 交给飞书步骤。
